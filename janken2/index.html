<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神経衰弱</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <div class="damage-bar-block">
            <div class="enemy-bar">
                <div class="enemy-bar-inner"></div>
            </div>
            <div class="player-bar">
                <div class="player-bar-inner"></div>
            </div>
        </div>
        <div><img src="" alt="コンピューター"></div>
        <div class="vertical"></div>
        <div><img src="" alt="プレイヤー"></div>
        <div class="clear-box">
            <div class="clear-box-inner">
                <p>クリア！</p>
                <div>今までのハイスコア<p id="highScore"></p></div>
                <div class="restart-button">もう一度遊ぶ</div>
            </div>
        </div>
        <div class="gameover-box">
            <P>ゲームオーバー😭</P>
            <div class="restart-button">もう一度遊ぶ</div>
        </div>
    </main>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
