<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神経衰弱</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>

        <!-- ヘッダーダメージバー -->
        <div class="damage-bar-block">
            <div class="enemy-data">
                <p class="enemy-score"></p>
                <p class="enemy-name"></p>
            </div>
            <div class="enemy-bar">
                <div class="enemy-bar-inner"></div>
            </div>
            <div class="stage-block">
                <p>VS</p>
                <p class="stage"></p>
            </div>
            <div class="player-bar">
                <div class="player-bar-inner"></div>
            </div>
            <div class="player-data">
                <p class="player-name"></p>
                <p class="player-score"></p>
            </div>
        </div>


        <!-- カードとユーザーと敵のイメージ画像 -->
        <div class="play-area-block">
            <div class="computer"><img src="images/alien_grey.png" alt="コンピューター" width="150px"></div>
            <div class="vertical"></div>
            <div class="player"><img src="images/undoukai_pyramid.png" alt="プレイヤー" width="150px"></div>
        </div>

        <!-- 名前が記録されてない時（初めて遊ぶ時）に表示される画面 -->
        <div class="play-first-box">
            <div class="play-first-box-inner">
                <h1>しんけいすいじゃくバトル</h1>
                <h2>遊び方</h2>
                <ul>
                    <li>カードを　めくろう！　おなじ　ぶきのカードを　そろえると　こうげきできるよ</li>
                    <li>もし　ちがう　カードを　えらんで　しまうと　たいりょくが　へるよ</li>
                    <li>こうげきの　ほかにも　かいふくや　たいりょくを　いれかえる　とくしゅカードも　あるよ</li>
                </ul>
                <p>あなたのなまえを入れてね</p>
                <input type="text" id="player-name-input">
                <div class="playstart-button">ゲームスタート</div>
            </div>
        </div>

        <!-- クリアボックス -->
        <div class="clear-box">
            <div class="clear-box-inner">
                <p>クリア！</p>
                <div class="highScore-box">ハイスコア<p class="highScore"></p></div>
                <div class="totalGames-box">ゲーム回数<p class="totalGames"></p></div>
                <div class="clearGames-box">クリア回数<p class="clearGames"></p></div>
                <div class="winRate-box">勝率<p class="winRate"></p>%</div>
                <div class="nextstage-button"><p class="stage"></p>に行く</div>
            </div>
        </div>

        <!-- オールクリア（全クリア）ボックス -->
        <div class="all-clear-box">
            <div class="clear-box-inner">
                <p>全ステージクリア！</p>
                <div class="highScore-box">ハイスコア<p class="highScore"></p></div>
                <div class="totalGames-box">ゲーム回数<p class="totalGames"></p></div>
                <div class="clearGames-box">クリア回数<p class="clearGames"></p></div>
                <div class="winRate-box">勝率<p class="winRate"></p>%</div>
                <div class="newgame-button">もう一度遊ぶ</div>
            </div>
        </div>

        <!-- ゲームオーバー -->
        <div class="gameover-box">
            <div class="gameover-box-inner">
                <P>ゲームオーバー😭</P>
                <div class="restart-button">もう一度遊ぶ</div>
            </div>
        </div>

        <!-- データ消去ボタン -->
        <div class="remove-data-button">
            <p>データを消去</p>
        </div>


    </main>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
